<!doctype html>
<html lang="zh-CN" data-quick-panel-window>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperClip Panel</title>
    <style>
      html[data-quick-panel-window],
      html[data-quick-panel-window] body,
      html[data-quick-panel-window] #root {
        background: transparent !important;
      }
      /* 固定尺寸面板不允许出现滚动条：系统"始终显示滚动条"或外接鼠标时，
         经典滚动条会以浅色轨道显示为右/底"白边"；尺寸已按内容高度 380 对齐，
         个别渲染差异只允许吃掉底部 padding，不允许滚动。 */
      html[data-quick-panel-window],
      html[data-quick-panel-window] body {
        overflow: hidden;
      }
      /* 面板为纯指针交互（原型无焦点态）：WKWebView 在窗口成为 key 时会把
         焦点给首个按钮，默认焦点环显示为蓝框，这里统一去掉。 */
      html[data-quick-panel-window] button:focus,
      html[data-quick-panel-window] button:focus-visible {
        outline: none;
      }
      /* Quick Panel 视觉基准 = 原型 D2：对齐原型的排版基线
         (Tailwind preflight 的 line-height:1.5 会撑高内联文本) */
      html[data-quick-panel-window] {
        line-height: normal;
        font-family:
          "Inter",
          "SF Pro Text",
          "SF Pro Display",
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      /* 对齐原型 D2 的 UA button 基线: Arial 13.3333px。
         App.css 的 button{font:inherit} 会继承 16px, 撑高分段按钮 (32 vs 30px)。
         仅作用于此 232px 面板, 不影响其他表面。 */
      html[data-quick-panel-window] button {
        font-size: 13.3333px;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/panel.tsx"></script>
  </body>
</html>
