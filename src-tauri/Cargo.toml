[package]
name = "superclip"
version = "0.1.0"
description = "Local-first clipboard history manager for macOS"
authors = ["rao"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "superclip_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
sha2 = "0.11.0"
tauri = { version = "2", features = [ "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipboard-rs = "0.3.5"
image = { version = "0.25.5", default-features = false, features = ["tiff"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-positioner = { version = "2.3.1", features = ["tray-icon"] }

[target."cfg(target_os = \"macos\")".dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
window-vibrancy = "0.6.0"

[profile.dev]
# 1 = 仅行号级调试信息：栈可定位到 文件:行，但没有变量；改为 2 可恢复完整调试信息
debug = 1
